[package]
name = "ams-reader-esp32"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "AMS Reader firmware binary for ESP32 (Rust / esp-idf-svc)"

[[bin]]
name = "ams-reader-esp32"
path = "src/main.rs"
harness = false

[dependencies]
ams-core = { path = "../ams-core" }
log = "0.4"
esp-idf-hal = "0.46.2"
esp-idf-svc = { version = "0.52.1", features = [
    "critical-section",
    "embassy-time-driver",
    "embassy-sync",
] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }

[build-dependencies]
embuild = "0.33"
